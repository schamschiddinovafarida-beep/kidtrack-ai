services:
  - type: web
    name: kidtrack-mvp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 90 server:app
    envVars:
      - key: KIDTRACK_API_KEY
        sync: false
      - key: KIDTRACK_MODEL
        value: gemini-3.8-flash
